name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y cmake gcc
          python3 -m venv .venv
          .venv/bin/pip install pytest gcovr
      - name: Build, analyze, test, coverage gate
        run: scripts/check.sh
      - name: Traceability gate
        run: .venv/bin/python scripts/trace.py --check
      - name: Seeded-defect campaign
        run: .venv/bin/python scripts/mutate.py
      - name: PIL harness (simulated target)
        run: .venv/bin/python scripts/pil.py --sim
  target-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Build firmware for Arduino UNO
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          scripts/build_target.sh
